[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opspilot"
version = "0.1.0"
description = "Agentic IT support and automation bot with policy-gated, audited, reversible actions"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["google-genai>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
opspilot = "opspilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
